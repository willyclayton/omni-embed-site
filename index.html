<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLB Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #001f3f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #002d62;
      border-bottom: 3px solid #bf0d3e;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header svg { flex-shrink: 0; }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
    }

    .embed-wrapper {
      flex: 1;
      border-radius: 10px;
      overflow: hidden;
      background: #002244;
      border: 1px solid rgba(255,255,255,0.08);
      min-height: 600px;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      inset: 0;
    }

    #status {
      text-align: center;
      padding: 24px;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
    }

    #status.error { color: #ff6b6b; }
  </style>
</head>
<body>
  <header>
    <!-- MLB-style baseball icon -->
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="14" r="13" fill="white" stroke="#bf0d3e" stroke-width="1.5"/>
      <path d="M6 10 Q10 14 6 18" stroke="#bf0d3e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M22 10 Q18 14 22 18" stroke="#bf0d3e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>MLB Stats Dashboard</h1>
  </header>

  <main>
    <div class="embed-wrapper">
      <p id="status">Loading dashboard…</p>
      <iframe
        id="omni-iframe"
        title="MLB Dashboard"
        allow="fullscreen"
      ></iframe>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
