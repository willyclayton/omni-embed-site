<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLB Stats Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise"></div>

  <header class="app-bar">
    <a href="./" class="app-bar__logo">
      <svg class="app-bar__logo-icon" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="13" cy="13" r="12" fill="white" stroke="#bf0d3e" stroke-width="1.5"/>
        <path d="M5.5 9.5 Q9 13 5.5 16.5" stroke="#bf0d3e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M20.5 9.5 Q17 13 20.5 16.5" stroke="#bf0d3e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      <span>MLB Stats Portal</span>
    </a>
    <div class="app-bar__right">
      <p id="viewing-as" class="app-bar__team viewing-as-badge"></p>
      <a href="login.html" class="app-bar__switch switch-team-link">Switch team</a>
    </div>
  </header>

  <main class="app-main">
    <div class="embed-container">
      <iframe
        id="omni-embed-iframe"
        data-embed-api="/api/embed-url"
        title="MLB dashboard"
        allow="fullscreen clipboard-write microphone"
        loading="lazy"
      ></iframe>
      <p id="embed-status" class="embed-status" aria-live="polite"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
