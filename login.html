<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select team | MLB Stats Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise"></div>

  <header class="app-bar">
    <a href="./" class="app-bar__logo">
      <svg class="app-bar__logo-icon" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="13" cy="13" r="12" fill="white" stroke="#bf0d3e" stroke-width="1.5"/>
        <path d="M5.5 9.5 Q9 13 5.5 16.5" stroke="#bf0d3e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M20.5 9.5 Q17 13 20.5 16.5" stroke="#bf0d3e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </svg>
      <span>MLB Stats Portal</span>
    </a>
    <a href="index.html" class="app-bar__switch">Dashboard</a>
  </header>

  <main class="login-main">
    <section class="login-card">
      <h1>Select your team</h1>
      <p class="login-desc">
        Choose your MLB team to view the dashboard filtered for that franchise&rsquo;s stats and analytics.
      </p>
      <form id="login-form" class="login-form">
        <label for="team-select" class="login-label">MLB team</label>
        <select id="team-select" class="login-select" required>
          <option value="" disabled selected>Select a team</option>
          <optgroup label="AL East">
            <option value="baltimore-orioles">Baltimore Orioles</option>
            <option value="boston-red-sox">Boston Red Sox</option>
            <option value="new-york-yankees">New York Yankees</option>
            <option value="tampa-bay-rays">Tampa Bay Rays</option>
            <option value="toronto-blue-jays">Toronto Blue Jays</option>
          </optgroup>
          <optgroup label="AL Central">
            <option value="chicago-white-sox">Chicago White Sox</option>
            <option value="cleveland-guardians">Cleveland Guardians</option>
            <option value="detroit-tigers">Detroit Tigers</option>
            <option value="kansas-city-royals">Kansas City Royals</option>
            <option value="minnesota-twins">Minnesota Twins</option>
          </optgroup>
          <optgroup label="AL West">
            <option value="houston-astros">Houston Astros</option>
            <option value="los-angeles-angels">Los Angeles Angels</option>
            <option value="oakland-athletics">Oakland Athletics</option>
            <option value="seattle-mariners">Seattle Mariners</option>
            <option value="texas-rangers">Texas Rangers</option>
          </optgroup>
          <optgroup label="NL East">
            <option value="atlanta-braves">Atlanta Braves</option>
            <option value="miami-marlins">Miami Marlins</option>
            <option value="new-york-mets">New York Mets</option>
            <option value="philadelphia-phillies">Philadelphia Phillies</option>
            <option value="washington-nationals">Washington Nationals</option>
          </optgroup>
          <optgroup label="NL Central">
            <option value="chicago-cubs">Chicago Cubs</option>
            <option value="cincinnati-reds">Cincinnati Reds</option>
            <option value="milwaukee-brewers">Milwaukee Brewers</option>
            <option value="pittsburgh-pirates">Pittsburgh Pirates</option>
            <option value="st-louis-cardinals">St. Louis Cardinals</option>
          </optgroup>
          <optgroup label="NL West">
            <option value="arizona-diamondbacks">Arizona Diamondbacks</option>
            <option value="colorado-rockies">Colorado Rockies</option>
            <option value="los-angeles-dodgers">Los Angeles Dodgers</option>
            <option value="san-diego-padres">San Diego Padres</option>
            <option value="san-francisco-giants">San Francisco Giants</option>
          </optgroup>
        </select>
        <button type="submit" class="btn btn-primary">View dashboard</button>
      </form>
      <p class="login-note">Your dashboard will load with this team&rsquo;s context and data.</p>
    </section>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var select = document.getElementById('team-select');
      var externalId = select.value;
      var name = select.options[select.selectedIndex].text;
      if (externalId && name) {
        try {
          sessionStorage.setItem('demoUser', JSON.stringify({ externalId: externalId, name: name }));
        } catch (err) {}
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
